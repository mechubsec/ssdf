[[tests]]
name = "junos_sys_ui_cfg_audit_set_redacts_encrypted_secret"
[[tests.inputs]]
insert_at = "junos_sys_ecs"
type = "raw"
value = "<182>1 2026-07-06T03:52:49.931Z vsrx-ci mgd 97400 UI_CFG_AUDIT_SET [junos@2636.1.1.1.2.129 username=\"netconf\" action=\"set\" pathname=\"system login user admin authentication encrypted-password\" data=\"$$9$$FAKEsecretHashData123\" value=\"$$9$$FAKEsecretHashData123\"] User 'netconf' set: system login user admin authentication encrypted-password \"$$9$$FAKEsecretHashData123\""
[[tests.outputs]]
extract_from = "junos_sys_ecs"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
# M16c: UI_CFG_AUDIT_SET data under a secret-shaped pathname, carrying a
# Junos encrypted-secret marker ($$9$$...), must be redacted before it reaches
# ssdf.events -- never the plaintext/encrypted value itself.
assert_eq!(.event_action, "configuration_change")
assert_eq!(.ext."junos.sys.pathname", "system login user admin authentication encrypted-password")
assert_eq!(.ext."junos.sys.data", "[REDACTED]")
assert!(.ext."junos.sys.data" != "$$9$$FAKEsecretHashData123")
# MEC-186: `value` (the NEW value being set) must be redacted too, not just
# `data` (the OLD value) -- that was the actual secret-leak gap.
assert_eq!(.ext."junos.sys.value", "[REDACTED]")
assert!(.ext."junos.sys.value" != "$$9$$FAKEsecretHashData123")
# F1 (MEC-167): the secret must not survive in .raw -- SD `data=`, SD
# `value=`, and the free-text message tail all carry the same string.
assert!(!contains(string!(.raw), "$$9$$FAKEsecretHashData123"))
'''

[[tests]]
name = "junos_sys_ui_cfg_audit_set_redacts_encrypted_marker_on_any_path"
[[tests.inputs]]
insert_at = "junos_sys_ecs"
type = "raw"
value = "<182>1 2026-07-06T03:52:49.932Z vsrx-ci mgd 97400 UI_CFG_AUDIT_SET [junos@2636.1.1.1.2.129 username=\"netconf\" action=\"set\" pathname=\"[system snmp community\\]\" data=\"$$9$$FAKEcommunityHash456\" value=\"$$9$$FAKEcommunityHash456\"] User 'netconf' set: [system snmp community] \"$$9$$FAKEcommunityHash456\""
[[tests.outputs]]
extract_from = "junos_sys_ecs"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
# A `$$9$$` value is redacted even when the pathname keyword list happens to
# miss this leaf name -- the encrypted-marker check is a second, independent
# net for exactly this case ("community" pathname is ALSO caught here, but the
# marker check alone is what must not regress).
assert_eq!(.ext."junos.sys.data", "[REDACTED]")
# F1 (MEC-167): the secret must not survive in .raw either.
assert!(!contains(string!(.raw), "$$9$$FAKEcommunityHash456"))
'''


[[tests]]
name = "srx_ipv6_flow_does_not_poison_the_ipv4_column"
[[tests.inputs]]
insert_at = "srx_ecs"
type = "raw"
value = '<14>1 2026-08-19T12:00:00.000Z vsrx-prod RT_FLOW - RT_FLOW_SESSION_CLOSE [junos@2636.1.1.1.2.36 source-address="fe80::1" source-port="546" destination-address="ff05:0:0:0:0:0::" destination-port="547" protocol-id="17" policy-name="v6-permit" source-zone-name="trust" destination-zone-name="untrust" bytes-from-client="10" bytes-from-server="20" username="N/A"]'
[[tests.outputs]]
extract_from = "srx_ecs"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
# ssdf.events.source_ip/destination_ip are Nullable(IPv4); a v6 address here makes
# ClickHouse reject the WHOLE batch (CANNOT_PARSE_IPV4), silently discarding every
# unrelated event batched with it. Keep the typed columns null and preserve the
# real addresses in ext.
assert_eq!(.source_ip, null)
assert_eq!(.destination_ip, null)
assert_eq!(.event_action, "flow_session_close")
assert_eq!(.ext."source-address", "fe80::1")
assert_eq!(.ext."destination-address", "ff05:0:0:0:0:0::")
'''


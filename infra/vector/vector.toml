value = "<182>1 2026-07-06T03:52:49.932Z vsrx-ci mgd 97400 UI_CFG_AUDIT_SET_SECRET [junos@2636.1.1.1.2.129 username=\"netconf\" action=\"set\" pathname=\"[security ike policy FAKEpol pre-shared-key ascii-text\\]\"] User 'netconf' set: [security ike policy FAKEpol pre-shared-key ascii-text]"
[[tests.outputs]]
extract_from = "junos_sys_ecs"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
# MEC-186: Junos never puts a secret-typed value in UI_CFG_AUDIT_SET -- it
# emits this msgid instead (pathname only, no data/value). The prior filter
# dropped it entirely, so PSK/password/RADIUS-secret changes never reached
# ssdf.events at all. Must now be admitted, tagged, and pathname-only.
assert_eq!(.event_provider, "juniper")
assert_eq!(.event_category, ["configuration"])
assert_eq!(.event_action, "configuration_change")
assert_eq!(.user_name, "netconf")
assert_eq!(.ext."junos.sys.secret", true)
assert_eq!(.ext."junos.sys.pathname", "[security ike policy FAKEpol pre-shared-key ascii-text\\]")
assert_eq!(.ext."junos.sys.msgid", "UI_CFG_AUDIT_SET_SECRET")
'''

[[tests]]
name = "junos_sys_ui_cfg_audit_other_redacts_snmp_community_pathname"
[[tests.inputs]]
insert_at = "junos_sys_ecs"
type = "raw"
value = "<182>1 2026-07-06T03:52:49.933Z vsrx-ci mgd 97400 UI_CFG_AUDIT_OTHER [junos@2636.1.1.1.2.129 username=\"netconf\" action=\"set\" pathname=\"[snmp community FAKEcomm1\\]\" delimiter=\"\" value=\"\"] User 'netconf' set: [snmp community FAKEcomm1]"
[[tests.outputs]]
extract_from = "junos_sys_ecs"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
# MEC-186: an SNMP community change can land under UI_CFG_AUDIT_OTHER (not
# just UI_CFG_AUDIT_SET) -- the community NAME in pathname is secret-shaped
# and must be redacted here too.
assert_eq!(.event_action, "configuration_change")
assert!(!contains(string!(.ext."junos.sys.pathname"), "FAKEcomm1"))
assert!(!contains(string!(.raw), "FAKEcomm1"))
'''

[[tests]]
name = "junos_sys_ui_cfg_audit_other_redacts_secret_value"
[[tests.inputs]]
insert_at = "junos_sys_ecs"
type = "raw"
value = "<182>1 2026-07-06T03:52:49.934Z vsrx-ci mgd 97400 UI_CFG_AUDIT_OTHER [junos@2636.1.1.1.2.129 username=\"netconf\" action=\"delete\" pathname=\"[security ike policy FAKEpol pre-shared-key\\]\" value=\"ascii-text $$9$$FAKEpskOther\"] User 'netconf' delete: [security ike policy FAKEpol pre-shared-key] \"ascii-text $$9$$FAKEpskOther\""
[[tests.outputs]]
extract_from = "junos_sys_ecs"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
# MEC-219 N1: a delete/deactivate/rename of a secret leaf can land under
# UI_CFG_AUDIT_OTHER carrying the encrypted value in `value=` -- the OTHER
# branch previously only redacted the pathname's community name, so this
# survived verbatim in both ext and .raw (fails against 9e9d57f).
assert_eq!(.event_action, "configuration_change")
assert_eq!(.ext."junos.sys.value", "[REDACTED]")
assert!(!contains(string!(.raw), "FAKEpskOther"))
'''

[[tests]]
name = "junos_sys_ui_cfg_audit_set_redacts_secret_past_an_escaped_quote"
[[tests.inputs]]
insert_at = "junos_sys_ecs"
type = "raw"
value = "<182>1 2026-07-06T03:52:49.935Z vsrx-ci mgd 97400 UI_CFG_AUDIT_SET [junos@2636.1.1.1.2.129 username=\"netconf\" action=\"set\" pathname=\"[system login user admin authentication-password\\]\" data=\"ab\\\"TAILsecret\" value=\"ab\\\"TAILsecret\"] User 'netconf' set: [system login user admin authentication-password] \"ab\\\"TAILsecret\""
[[tests.outputs]]
extract_from = "junos_sys_ecs"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
# MEC-219 N2: the naive `value="(?P<val>[^"]*)"` stopped at the first
# escaped quote inside the secret, so the tail of the value ("TAILsecret")
# stayed verbatim in .raw even though ext.value was redacted (fails
# against 9e9d57f). The escape-aware regex must capture the whole value.
assert_eq!(.event_action, "configuration_change")
assert_eq!(.ext."junos.sys.value", "[REDACTED]")
assert!(!contains(string!(.raw), "TAILsecret"))
'''


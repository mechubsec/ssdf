[project]
name = "ssdf-health"
version = "0.2.0"
description = "SSDF M13a host resource-pressure poller (MCP -> ssdf.health_metrics)"
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=0.8",
    "fastmcp>=3.4.11,<4",
    "defusedxml>=0.7",
    "ssdf-common",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssdf_health"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires live ClickHouse + MCP servers (deselect with -m 'not integration')"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
ssdf-common = { path = "../common", editable = true }

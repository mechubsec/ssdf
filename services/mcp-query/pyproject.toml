[project]
name = "ssdf-mcp-query"
version = "0.2.0"
description = "SSDF M2 read-only MCP query layer over ssdf.events (ClickHouse)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "clickhouse-connect>=0.8",
    "sqlglot>=25.0",
    "networkx>=3.0",
    "ssdf-common",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssdf_mcp_query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the live lab (ClickHouse + MCP endpoints); deselect with -m 'not integration'",
    "contract: requires only a throwaway ClickHouse; runs in CI against a service container",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv.sources]
ssdf-common = { path = "../common", editable = true }

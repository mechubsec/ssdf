[project]
name = "ssdf-policy"
version = "0.2.0"
description = "SSDF M6b configured-policy collector + resolver (firewall rulesets -> entities)"
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=0.8",
    "defusedxml>=0.7",
    "fastmcp>=3.4.11,<4",
    "ssdf-common",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssdf_policy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires live ClickHouse + MCPs (deselect with -m 'not integration')"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv.sources]
ssdf-common = { path = "../common", editable = true }

[project]
name = "ssdf-common"
version = "0.2.0"
description = "SSDF shared utilities — MCP client, ClickHouse helpers, collector registry"
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=0.8",
    "fastmcp>=3.4.11,<4",
    "opentelemetry-api>=1.45.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssdf_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

- id: topo-entity-kind-panosvm
  question: What kind of entity is panosvm, and what role does it have?
  # sovereign-only since M7c: the public tier no longer exposes topology/identity
  # tools (only the 3 de-identified metrics tools), so get_entity is sovereign-only.
  tier: sovereign
  category: topology
  difficulty: easy
  answer_format: 'Answer with JSON: {"kind": "<kind>", "role": "<role>"}'
  required_tools: [get_entity]
  predicate:
    type: expected_json
    expected: {kind: device, role: firewall}

- id: topo-firewall-inventory
  question: Which devices in the topology are firewalls?
  # sovereign-only: firewall role-attribution is a sovereign capability. The public
  # graph carries no role=firewall device nodes (only pve hypervisors as devices);
  # firewall-named Proxmox guests appear as host nodes, so the question is
  # structurally unanswerable on the public tier. See 2026-06-19 3-model matrix.
  tier: sovereign
  category: topology
  difficulty: medium
  answer_format: 'Answer with JSON: {"firewalls": ["<name>", ...]}'
  required_tools: [topology_snapshot]
  predicate:
    type: expected_json
    expected: {firewalls: [panosvm, vsrx-br01, vsrx-br02, vsrx-br03, vsrx-br04, vsrx-br05, vsrx-br06, vsrx-br07, vsrx-br08, vsrx-br09, vsrx-br10, vsrx-br11, vsrx-br12, vsrx-campus-a, vsrx-campus-b, vsrx-ci, vsrx-core-a, vsrx-core-b, vsrx-dc, vsrx-dmz, vsrx-isp-a, vsrx-isp-b, vsrx-prod, vsrx-wan-edge]}

- id: topo-path-labgen-gateway
  question: >-
    Does a path exist in the topology graph between 203.0.113.20 and
    198.51.100.1?
  # sovereign-only since M7c: find_path is a topology tool, removed from the
  # public tier when it became the de-identified metrics surface.
  tier: sovereign
  category: topology
  difficulty: hard
  answer_format: 'Answer with JSON: {"path_exists": <true|false>}'
  required_tools: [find_path]
  predicate:
    type: expected_json
    expected: {path_exists: true}

- id: identity-reidentify-busiest-surrogate
  question: >-
    On the public metrics surface, the host surrogate with the highest total
    bytes in the last 24 hours maps to which real IP address?
  tier: sovereign
  category: topology
  difficulty: hard
  answer_format: 'Answer with JSON: {"ip": "<ip address>"}'
  required_tools: [reidentify]
  predicate:
    type: reference_sql
    sql: >-
      SELECT real_value FROM ssdf.pseudonym_map FINAL
      WHERE kind = 'host' AND surrogate = (
        SELECT surrogate FROM ssdf_public.entity_series FINAL
        WHERE metric = 'bytes'
          AND bucket_start >= now() - INTERVAL 24 HOUR
        GROUP BY surrogate ORDER BY sum(value) DESC LIMIT 1)
      LIMIT 1
    match: exact
    answer_key: ip


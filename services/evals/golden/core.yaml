    params: {min_overlap: 2}

- id: flows-paloalto-actions-7d
  question: Which event actions has the paloalto provider logged in the last 7 days?
  tier: sovereign
  category: flows
  difficulty: easy
  answer_format: 'Answer with JSON: {"actions": ["<action>", ...]}'

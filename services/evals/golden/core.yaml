- id: flows-total-bytes-7d
  question: Approximately how many total bytes were logged across all flows in the last 7 days?
  tier: sovereign
  category: flows
  difficulty: hard
  answer_format: 'Answer with JSON: {"bytes": <int>}'
  required_tools: []
  predicate:
    type: reference_sql
    sql: >-
      SELECT sum(network_bytes) FROM ssdf.events
      WHERE timestamp >= now() - INTERVAL 7 DAY
    match: numeric_tolerance
    answer_key: bytes
    params: {tolerance_pct: 15}

# ---- public metrics (M7c de-identified surface) ----
- id: metric-bytes-total-24h
  question: >-
    Using the public metrics surface, what is the total bytes volume across all
    time buckets in the last 24 hours?
  tier: public
  category: flows
  difficulty: medium
  answer_format: 'Answer with JSON: {"bytes": <int>}'
  required_tools: [metric_timeseries]
  predicate:
    type: reference_sql
    sql: >-
      SELECT toInt64(sum(value)) FROM ssdf_public.metric_timeseries FINAL
      WHERE metric = 'bytes' AND dim = ''
        AND bucket_start >= now() - INTERVAL 24 HOUR
    match: numeric_tolerance
    answer_key: bytes
    params: {tolerance_pct: 10}

- id: metric-top-surrogate-bytes-24h
  question: >-
    On the public metrics surface, which host surrogate had the highest total
    bytes in the last 24 hours?
  tier: public
  category: flows
  difficulty: medium
  answer_format: 'Answer with JSON: {"surrogate": "<surrogate id>"}'
  required_tools: [top_series]
  predicate:
    type: reference_sql
    sql: >-
      SELECT surrogate FROM ssdf_public.entity_series FINAL
      WHERE metric = 'bytes'
        AND bucket_start >= now() - INTERVAL 24 HOUR
      GROUP BY surrogate ORDER BY sum(value) DESC LIMIT 1
    match: exact
    answer_key: surrogate

- id: metric-busiest-surrogate-volume-24h
  question: >-
    On the public metrics surface, for the host surrogate with the highest total
    bytes in the last 24 hours, how many bytes did it accumulate over that window?
  tier: public
  category: flows
  difficulty: hard
  answer_format: 'Answer with JSON: {"bytes": <int>}'
  required_tools: [entity_metric_timeseries, top_series]
  predicate:
    type: reference_sql
    sql: >-
      SELECT toInt64(max(total)) FROM (
        SELECT sum(value) AS total FROM ssdf_public.entity_series FINAL
        WHERE metric = 'bytes'
          AND bucket_start >= now() - INTERVAL 24 HOUR
        GROUP BY surrogate)
    match: numeric_tolerance
    answer_key: bytes
    params: {tolerance_pct: 10}

